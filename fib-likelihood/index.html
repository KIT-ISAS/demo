3","#92D741","#95D73F","#97D83E","#9AD83C","#9DD93A","#9FD938","#A2DA37","#A5DA35","#A7DB33","#AADB32","#ADDC30","#AFDC2E","#B2DD2C","#B5DD2B","#B7DD29","#BADE27","#BDDE26","#BFDF24","#C2DF22","#C5DF21","#C7E01F","#CAE01E","#CDE01D","#CFE11C","#D2E11B","#D4E11A","#D7E219","#DAE218","#DCE218","#DFE318","#E1E318","#E4E318","#E7E419","#E9E419","#ECE41A","#EEE51B","#F1E51C","#F3E51E","#F6E61F","#F8E621","#FAE622","#FDE724"]]]},"code":"const INITIAL = {\"tx\": 1400.0, \"ty\": 2600.0, \"s1x\": -2000.0, \"s1y\": 0.0, \"s2x\": 2000.0, \"s2y\": 0.0, \"px\": 400.0, \"py\": 1800.0, \"r\": 4370.18691180654, \"rho\": 6828.519724631807, \"phi\": 1.832501759888669, \"zr\": 0.3, \"zrho\": -0.4, \"zphi\": 0.4, \"hm\": 0.20284663110077433, \"hb\": 0.6060437197211057, \"hd\": 3602.2492973141107, \"bsens\": 2, \"sr\": 300.0, \"srho\": 300.0, \"sphi\": 5.0, \"sp\": 1500.0, \"mode\": 2, \"pc\": 1, \"method\": 1, \"n\": 200, \"prune\": 0, \"dens\": 2, \"approx\": 0, \"kscale\": 0.7};\nconst NPT = 181;\nconst NG = 121;\nconst NR = 40;\nconst NA = 24;\nconst HANDLE_SIZE = 15;\nconst PLAIN_COLOR = \"#2a788e\";\nconst PTS_STYLE = {\"marker\": [\"star\", \"triangle\", \"inverted_triangle\", \"plus\"], \"color\": [\"#dc2626\", \"#111827\", \"#111827\", \"#2563eb\"], \"size\": [28, 20, 20, 22]};\nconst HANDLE_COLORS = [\"#7c3aed\", \"#0f766e\", \"#b45309\"];\nconst DENSITIES = [\"proposal\", \"likelihood\", \"posterior\"];\nconst METHODS = [\"random\", \"fibonacci\"];\nconst SYSTEMS = [\"euclidean\", \"polar\", \"elliptic\"];\nconst POLAR_CENTERS = [\"s1\", \"s2\", \"mid\"];\nconst CONTOUR_LEVELS = [0.1, 0.3, 0.5, 0.7, 0.9];\n// Pure-math part of the Fib-Sampling demo (no Bokeh): JavaScript port of model.py.\n// Runs in the browser (inside the Bokeh CustomJS callbacks) and under Node for the cross-check\n// tests against the Python reference implementation (tests/test_js_model.py).\n//\n// Scene: {target, s1, s2, prior_mean: [x, y], r, rho, phi, sig_r, sig_rho, sig_phi, sig_p,\n//         mono, bi, brg, prior: bool, system: \"euclidean\" | \"polar\" | \"elliptic\",\n//         polar_center: \"s1\" | \"s2\" | \"mid\"}\nconst FibModel = (() =&gt; {\n  const TAU = 2 * Math.PI\n  const GOLDEN = (1 + Math.sqrt(5)) / 2\n  const wrap = (a) =&gt; (((a + Math.PI) % TAU) + TAU) % TAU - Math.PI\n  const mod = (a, m) =&gt; ((a % m) + m) % m\n\n  function linspace(a, b, n) {\n    const r = new Float64Array(n)\n    for (let i = 0; i &lt; n; i++) r[i] = n === 1 ? a : a + (b - a) * i / (n - 1)\n    return r\n  }\n\n  const isPolar = (sc) =&gt; sc.system === \"polar\"\n  const mid = (sc) =&gt; [(sc.s1[0] + sc.s2[0]) / 2, (sc.s1[1] + sc.s2[1]) / 2]\n  const polarOrigin = (sc) =&gt; ({s1: sc.s1, s2: sc.s2, mid: mid(sc)})[sc.polar_center]\n  // Bearing is measured at S1 only in polar mode without bistatic range, else at S2.\n  const bearingSensor = (sc) =&gt; (isPolar(sc) &amp;&amp; !sc.bi ? sc.s1 : sc.s2)\n  const anyLikelihood = (sc) =&gt; sc.mono || sc.bi || sc.brg\n\n  // ------------------------------------------------------------------ coordinate systems\n  // toXY / fromXY write into `out` to avoid allocations in the grid loops.\n  // fillGrid(us, vs, X, Y, LJ) evaluates xy and the log area element on the tensor grid us \u00d7 vs\n  // (row-major, index i * nv + j) using per-row/per-column trigonometry.\n  function euclidean(sc) {\n    const o = mid(sc)\n    return {\n      name: \"euclidean\", labels: [\"x\", \"y\"], periodic: false, origin: o,\n      fillGrid: (us, vs, X, Y, LJ) =&gt; {\n        const nv = vs.length\n        for (let i = 0; i &lt; us.length; i++) {\n          for (let j = 0; j &lt; nv; j++) { const k = i * nv + j; X[k] = us[i]; Y[k] = vs[j]; LJ[k] = 0 }\n        }\n      },\n      toXY: (u, v, out) =&gt; { out[0] = u; out[1] = v },\n      fromXY: (x, y, out) =&gt; { out[0] = x; out[1] = y },\n      jac: () =&gt; 1,\n      uBounds: (R) =&gt; [o[0] - R, o[0] + R],\n      vBounds: (R) =&gt; [o[1] - R, o[1] + R],\n    }\n  }\n\n  function polar(center) {\n    const [cx, cy] = center\n    return {\n      name: \"polar\", labels: [\"r\", \"\u03c6\"], periodic: true, origin: center,\n      fillGrid: (us, vs, X, Y, LJ) =&gt; {\n        const nv = vs.length, cv = vs.map(Math.cos), sv = vs.map(Math.sin)\n        for (let i = 0; i &lt; us.length; i++) {\n          const u = us[i], lj = Math.log(u)\n          for (let j = 0; j &lt; nv; j++) {\n            const k = i * nv + j\n            X[k] = cx + u * cv[j]; Y[k] = cy + u * sv[j]; LJ[k] = lj\n          }\n        }\n      },\n      toXY: (u, v, out) =&gt; { out[0] = cx + u * Math.cos(v); out[1] = cy + u * Math.sin(v) },\n      fromXY: (x, y, out) =&gt; {\n        const dx = x - cx, dy = y - cy\n        out[0] = Math.sqrt(dx * dx + dy * dy); out[1] = Math.atan2(dy, dx)\n      },\n      jac: (u) =&gt; u,\n      uBounds: (R) =&gt; [0, R],\n      vBounds: () =&gt; [-Math.PI, Math.PI],\n    }\n  }\n\n  // Confocal elliptic coordinates with foci S1 and S2: rho = 2 c cosh(mu).\n  function elliptic(s1, s2) {\n    const dx = s2[0] - s1[0], dy = s2[1] - s1[1]\n    const o = [(s1[0] + s2[0]) / 2, (s1[1] + s2[1]) / 2]\n    const c = Math.max(Math.hypot(dx, dy) / 2, 1)\n    const a = Math.atan2(dy, dx), ca = Math.cos(a), sa = Math.sin(a)\n    return {\n      name: \"elliptic\", labels: [\"\u03bc\", \"\u03bd\"], periodic: true, origin: o, c,\n      fillGrid: (us, vs, X, Y, LJ) =&gt; {\n        const nv = vs.length, cv = vs.map(Math.cos), sv = vs.map(Math.sin), c2 = c * c\n        for (let i = 0; i &lt; us.length; i++) {\n          const ch = c * Math.cosh(us[i]), sh = c * Math.sinh(us[i])\n          for (let j = 0; j &lt; nv; j++) {\n            const k = i * nv + j, lx = ch * cv[j], ly = sh * sv[j]\n            X[k] = o[0] + ca * lx - sa * ly; Y[k] = o[1] + sa * lx + ca * ly\n            LJ[k] = Math.log(sh * sh + c2 * sv[j] * sv[j])\n          }\n        }\n      },\n      toXY: (u, v, out) =&gt; {\n        const lx = c * Math.cosh(u) * Math.cos(v), ly = c * Math.sinh(u) * Math.sin(v)\n        out[0] = o[0] + ca * lx - sa * ly; out[1] = o[1] + sa * lx + ca * ly\n      },\n      fromXY: (x, y, out) =&gt; {\n        const ex = x - o[0], ey = y - o[1]\n        const lx = ca * ex + sa * ey, ly = -sa * ex + ca * ey\n        const d1 = Math.hypot(lx + c, ly), d2 = Math.hypot(lx - c, ly)\n        out[0] = Math.acosh(Math.max((d1 + d2) / (2 * c), 1))\n        const nu = Math.acos(Math.max(-1, Math.min(1, (d1 - d2) / (2 * c))))\n        out[1] = ly &lt; 0 ? -nu : nu\n      },\n      jac: (u, v) =&gt; c * c * (Math.sinh(u) ** 2 + Math.sin(v) ** 2),\n      uBounds: (R) =&gt; [0, Math.acosh(Math.max(R / c, 1.0001))],\n      vBounds: () =&gt; [-Math.PI, Math.PI],\n    }\n  }\n\n  function coordinates(sc) {\n    if (sc.system === \"euclidean\") return euclidean(sc)\n    if (isPolar(sc)) return polar(polarOrigin(sc))\n    return elliptic(sc.s1, sc.s2)\n  }\n\n  // ------------------------------------------------------------------ densities\n  function logPriorFn(sc) {\n    if (!sc.prior) return () =&gt; 0\n    const [mx, my] = sc.prior_mean, k = 0.5 / (sc.sig_p * sc.sig_p)\n    return (x, y) =&gt; -k * ((x - mx) ** 2 + (y - my) ** 2)\n  }\n\n  function logPosteriorFn(sc) {\n    const [ax, ay] = sc.s1, [bx, by] = sc.s2, [cx, cy] = bearingSensor(sc)\n    const mono = !!sc.mono, bi = !!sc.bi, brg = !!sc.brg, prior = !!sc.prior\n    const r = sc.r, rho = sc.rho, phi = sc.phi, PI = Math.PI\n    const ir = 1 / sc.sig_r, irho = 1 / sc.sig_rho, iphi = 1 / sc.sig_phi\n    const [mx, my] = sc.prior_mean, kp = 0.5 / (sc.sig_p * sc.sig_p)\n    return (x, y) =&gt; {\n      let lp = prior ? -kp * ((x - mx) * (x - mx) + (y - my) * (y - my)) : 0\n      const d1 = Math.sqrt((x - ax) * (x - ax) + (y - ay) * (y - ay))\n      if (mono) { const e = (d1 - r) * ir; lp -= 0.5 * e * e }\n      if (bi) {\n        const e = (d1 + Math.sqrt((x - bx) * (x - bx) + (y - by) * (y - by)) - rho) * irho\n        lp -= 0.5 * e * e\n      }\n      if (brg) {\n        let a = Math.atan2(y - cy, {\n      let s = 0\n      for (let j = 0; j &lt; nv; j++) {\n        const ak = a[i * nv + j]\n        if (!(mx &gt; -Infinity)) { s += 1; pv[j] += 1 } else if (ak &gt; lo) {\n          const m = Math.exp(ak - mx)\n          s += m; pv[j] += m\n        }\n      }\n      pu[i] = s\n    }\n    g.pu = pu; g.pv = pv  // marginal masses\n    return g\n  }\n\n  function searchLeft(arr, x) {  // first index with arr[i] &gt;= x\n    let lo = 0, hi = arr.length\n    while (lo &lt; hi) { const m = (lo + hi) &gt;&gt; 1; if (arr[m] &lt; x) lo = m + 1; else hi = m }\n    return lo\n  }\n\n  function linearSupport(mass, edges, eps = 1e-10, pad = 2) {\n    const n = mass.length, cum = new Float64Array(n)\n    let s = 0\n    for (let i = 0; i &lt; n; i++) { s += mass[i]; cum[i] = s }\n    for (let i = 0; i &lt; n; i++) cum[i] /= s\n    const lo = Math.max(searchLeft(cum, eps) - pad, 0)\n    const hi = Math.min(searchLeft(cum, 1 - eps) + 1 + pad, n)\n    return [edges[lo], edges[hi]]\n  }\n\n  // Smallest arc [start, start + length) outside of the longest gap without mass.\n  function circularSupport(mass, edges, eps = 1e-12, pad = 2) {\n    const n = mass.length\n    const mx = Math.max(...mass)\n    const off = Array.from(mass, (m) =&gt; m &lt;= eps * mx)\n    if (!off.some(Boolean)) return [edges[0], TAU]\n    let bestLen = 0, bestEnd = 0, run = 0\n    for (let i = 0; i &lt; 2 * n; i++) {\n      run = off[i % n] ? run + 1 : 0\n      if (bestLen &lt; run &amp;&amp; run &lt;= n) { bestLen = run; bestEnd = i }\n    }\n    const start = mod(bestEnd + 1 - pad, n)\n    const length = Math.min(n - bestLen + 2 * pad, n)\n    const width = edges[1] - edges[0]\n    return [edges[0] + start * width, length * width]\n  }\n\n  // 1D density, linear between the (uniform) nodes, from cell-average values; exact inverse-CDF\n  // sampling. Piecewise-linear instead of piecewise-constant keeps the overlay contours smooth.\n  function linearPdf(edges, cellPdf) {\n    const n = cellPdf.length, h = ed
